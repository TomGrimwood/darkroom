[project]
name = "darkroom"
version = "0.1.3"
description = "A stage's sensors rendered into capture folders: cameras, lidars and skies by NVIDIA's ovrtx, poses, IMUs and GNSS worked out with USD."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.15",
    "usdsensors",
    "laspy[lazrs]>=2.5",
    "numpy>=2",
    "openexr>=3.3",
    "pillow>=10",
    "pymap3d>=3",
    "rich>=14",
    "usd-core>=25.5",
    # NVIDIA's ovrtx, the renderer (`darkroom.ovrtx`, in a process of its own), and its stage.
    "ovrtx==0.7.0.1794596436",
    "ovstage==0.4.0.1794520352",
]

[dependency-groups]
# import-linter for the import rules.
dev = ["pytest>=8", "import-linter>=2.1", "ruff>=0.14", "ty>=0.0.1a20"]

[tool.uv.sources]
usdsensors = { git = "https://github.com/TomGrimwood/usdsensors", tag = "v0.1.0" }
# NVIDIA's renderer from NVIDIA's own index: PyPI's ovrtx is a stub that fetches it there as it
# installs, so the lock would not hold the real wheels.
ovrtx = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header --tb=short -p no:cacheprovider --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Preview rules only where named: PLW1514, text files opened with their encoding said.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PLW1514"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Its renderer classes load lazily (`__getattr__`): ruff's preview cannot see them.
"src/darkroom/renderers/__init__.py" = ["F822"]

[tool.ruff.lint.flake8-bugbear]
# Frozen: safe as an argument's default.
extend-immutable-calls = ["darkroom.options.Options"]

[tool.importlinter]
root_packages = ["darkroom"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "what a sensor is stands apart from rendering it"
type = "forbidden"
source_modules = ["darkroom.sensorkit"]
forbidden_modules = ["darkroom.run", "darkroom.share", "darkroom.truth", "darkroom.surroundings", "darkroom.skies", "darkroom.looks", "darkroom.board", "darkroom.terminal", "darkroom.events", "darkroom.stills", "darkroom.format"]

[[tool.importlinter.contracts]]
name = "the front door's own modules load no USD: importing darkroom stays cheap (looks reads its presets with USD when first asked)"
type = "forbidden"
source_modules = ["darkroom.board", "darkroom.terminal", "darkroom.events", "darkroom.options", "darkroom.renderjob", "darkroom.format", "darkroom.stills", "darkroom.turns", "darkroom.gpu", "darkroom.perf", "darkroom.mosaic", "darkroom.lidarscans"]
forbidden_modules = ["pxr", "darkroom.sensorkit", "darkroom.run", "darkroom.share", "darkroom.truth"]

[[tool.importlinter.contracts]]
name = "a board knows only the events it is told"
type = "forbidden"
source_modules = ["darkroom.board", "darkroom.terminal", "darkroom.events"]
forbidden_modules = ["darkroom.looks", "darkroom.skies", "darkroom.surroundings", "darkroom.ovrtx"]

[[tool.importlinter.contracts]]
name = "running a function in a process of its own knows nothing of what it runs"
type = "forbidden"
source_modules = ["darkroom.process"]
forbidden_modules = ["pxr", "ovrtx", "ovstage", "darkroom.run", "darkroom.share", "darkroom.ovrtx", "darkroom.renderers", "darkroom.sensorkit", "darkroom.board", "darkroom.events"]

[[tool.importlinter.contracts]]
name = "ovrtx's side is run only through its launcher, in a process of its own"
type = "protected"
protected_modules = ["darkroom.ovrtx"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "ovrtx is loaded only by its renderer, its lidars and its stage"
type = "forbidden"
source_modules = ["darkroom.renderers", "darkroom.run", "darkroom.share", "darkroom.stills", "darkroom.options", "darkroom.eyes", "darkroom.frames", "darkroom.outcome", "darkroom.looks", "darkroom.ovrtx.ovrtx_renderer_cfg", "darkroom.ovrtx.ovrtx_usd", "darkroom.ovrtx.settings"]
forbidden_modules = ["ovrtx", "ovstage"]
allow_indirect_imports = true

[tool.ty.analysis]
# USD is C++ bindings without usable type information: check our code, not theirs.
replace-imports-with-any = ["pxr.**"]
